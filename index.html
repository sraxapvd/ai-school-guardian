<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI School Guardian</title><link rel="stylesheet" href="shared/shared.css"><style>:root{--navy:#10233f;--blue:#3978ff;--bg:#f5f7fb;--border:#e5e9f1;--muted:#738096;--shadow:0 12px 35px rgba(22,35,60,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#182338}.login{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#f5f8ff,#eef4ff)}.login-card{width:min(520px,100%);background:#fff;border:1px solid var(--border);border-radius:28px;padding:38px;box-shadow:var(--shadow)}.logo{width:48px;height:48px;border-radius:15px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.brand{display:flex;gap:13px;align-items:center}.brand h1{font-size:19px;margin:0}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}h2{font-size:30px;margin:42px 0 8px}.subtitle{color:var(--muted);margin:0 0 28px}.roles{display:grid;gap:10px}.role{border:1px solid var(--border);background:#fff;border-radius:15px;padding:16px;text-align:left;font-weight:750;cursor:pointer}.role:hover{border-color:#3978ff;background:#eaf1ff}.role small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.demo{margin-top:18px;text-align:center;background:#f4f7ff;border:1px dashed #b9c9f5;border-radius:13px;padding:11px;font-size:13px;color:#46629d}</style></head><body><div class="login"><div class="login-card"><div class="brand"><div class="logo">AI</div><div><h1>AI School Guardian</h1><span>One Web Application · Student · Teacher · Admin</span></div></div><h2>เข้าสู่ระบบ Demo</h2><p class="subtitle">เลือกบทบาทเพื่อเริ่ม Demo แบบ End-to-End</p><div class="roles"><button class="role" onclick="enter('student')">👩‍🎓 Student Demo<small>เข้าสู่ Student Dashboard</small></button><button class="role" onclick="enter('teacher')">👨‍🏫 Teacher Demo<small>รับแจ้งเหตุ วิเคราะห์ และจัดการเคส</small></button><button class="role" onclick="enter('admin')">🏫 Admin Demo<small>ดูภาพรวม Pattern และความปลอดภัยของโรงเรียน</small></button></div><div class="demo"><b>Shared Case Store</b> · ทุก Role ใช้ข้อมูล Case เดียวกันผ่าน Cloud Database เมื่อกำหนดค่า Supabase</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared/supabase-config.js"></script><script src="shared/shared.js"></script><script>function enter(role){ASG.login(role);window.location.href=role+'/index.html'}</script></body></html>
