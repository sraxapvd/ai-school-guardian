<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI School Guardian — Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#182338}button,input{font:inherit}button{cursor:pointer}:root{--n:#10233f;--b:#3978ff;--bl:#eaf1ff;--bd:#e5e9f1;--m:#738096;--g:#19a974;--gb:#eaf9f2;--o:#f59e0b;--ob:#fff6df;--r:#e53935;--rb:#fff0ef}.login{min-height:100vh;display:grid;place-items:center;background:#eef4ff;padding:20px}.box,.card{background:#fff;border:1px solid var(--bd);border-radius:20px;box-shadow:0 8px 28px #10233f10}.box{width:min(450px,100%);padding:38px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small,.muted{color:var(--m)}h1{margin-top:35px}label{display:block;font-size:13px;font-weight:750;margin:17px 0 7px}input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:var(--b);color:#fff}.secondary{background:#fff;border:1px solid var(--bd)}.danger{background:var(--r);color:#fff}.full{width:100%;margin-top:12px}.demo{margin-top:12px;padding:11px;background:var(--bl);border-radius:12px;text-align:center;font-size:13px}.shell{display:flex;min-height:100vh}.side{position:fixed;width:245px;height:100vh;background:#fff;border-right:1px solid var(--bd);padding:24px 14px}.side>.brand{padding:0 10px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:#68768b;font-weight:700}.nav button:hover,.nav button.active{background:var(--bl);color:var(--b)}.main{margin-left:245px;width:calc(100% - 245px);padding:28px 38px 60px}.wrap{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h2{margin:0}.avatar{width:42px;height:42px;border-radius:50%;background:#dce8ff;color:#3158a8;display:grid;place-items:center;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:19px}.stat small{color:var(--m)}.stat strong{display:block;font-size:28px;margin-top:7px}.red{color:#c52b28}.orange{color:#a96b00}.green{color:var(--g)}.section{margin-top:18px;padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.insight{padding:15px;border:1px solid var(--bd);border-radius:14px}.ai{background:var(--bl);color:#294d98}.pattern{background:var(--ob);border:1px solid #f2d38a}.metric{background:#f8fafc;border-radius:13px;padding:14px}.metric small{display:block;color:var(--m);margin-bottom:5px}.metric strong{font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:13px 9px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}.table th{color:var(--m);font-size:12px}.table tr:hover{background:#fafcff}.badge{display:inline-block;padding:6px 9px;border-radius:99px;font-size:11px;font-weight:850}.br{background:var(--rb);color:#c52b28}.bo{background:var(--ob);color:#a96b00}.bg{background:var(--gb);color:var(--g)}.bb{background:var(--bl);color:#315dc1}.map{height:430px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#eef3f8 1px,transparent 1px),linear-gradient(90deg,#eef3f8 1px,transparent 1px);background-size:25px 25px}.building{position:absolute;border:2px solid white;border-radius:15px;padding:14px;font-weight:800;box-shadow:0 7px 18px #10233f18}.safe{background:var(--gb)}.watch{background:#fff7d9}.high{background:#fff1df}.critical{background:#ffe7e6}.a{left:5%;top:9%;width:28%;height:25%}.b{left:39%;top:11%;width:33%;height:31%}.gym{left:75%;top:8%;width:19%;height:25%}.caf{left:10%;top:52%;width:31%;height:24%}.lib{left:49%;top:52%;width:22%;height:24%}.rest{left:76%;top:48%;width:17%;height:16%}.court{left:43%;top:83%;width:42%;height:10%;background:var(--bl)}.detail{margin-top:15px}.privacy{display:grid;grid-template-columns:1fr 1fr;gap:12px}.flow{text-align:center}.flow div{padding:12px;background:#f8fafc;border-radius:12px;margin:8px}.bars{height:180px;display:flex;align-items:end;gap:10px;padding:15px;border-bottom:1px solid var(--bd)}.bar{flex:1;background:var(--b);border-radius:7px 7px 0 0}.toast{position:fixed;right:20px;bottom:20px;background:var(--n);color:#fff;padding:13px 16px;border-radius:12px;z-index:10}@media(max-width:900px){.side{width:70px}.side .brand div:not(.logo),.nav span{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.stats{grid-template-columns:1fr 1fr}.grid2,.grid3,.privacy{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const C=[['SG-1024','#1024','การกลั่นแกล้ง','สูง','อาคาร B','10:32','กำลังช่วยเหลือ'],['SG-1082','#1082','ความรุนแรงทางร่างกาย','วิกฤต','โรงยิม','10:45','รอการเข้าช่วยเหลือ'],['SG-1102','#1102','ความขัดแย้ง','ปานกลาง','โรงอาหาร','11:10','กำลังตรวจสอบ'],['SG-1091','#1091','การคุกคาม / การรบกวน','ต่ำ','ห้องสมุด','09:20','แก้ไขแล้ว']];let S={p:'login',f:'ทั้งหมด',q:''};const app=document.getElementById('app');function go(p){S.p=p;render()}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}function rc(r){return r==='วิกฤต'?'br':r==='สูง'||r==='ปานกลาง'?'bo':'bg'}function layout(body,title){app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="logo">AI</div><div><b>AI School</b><br><small>Management Portal</small></div></div><nav class="nav">${[['dashboard','⌂','แดชบอร์ด'],['insights','✦','AI Insights'],['pattern','⚠','Pattern Detection'],['map','⌖','แผนที่ความปลอดภัย'],['analytics','▥','Analytics'],['esc','↗','Escalation'],['privacy','◈','Privacy & Security'],['profile','◯','Profile']].map(x=>`<button class="${S.p===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join('')}</nav></aside><main class="main"><div class="wrap"><div class="top"><h2>${title}</h2><div class="avatar">A</div></div>${body}</div></main></div>`}function login(){app.innerHTML=`<div class="login"><div class="box"><div class="brand"><div class="logo">AI</div><div><b>AI School Guardian</b><br><small>School Management Portal</small></div></div><h1>เข้าสู่ระบบผู้บริหาร</h1><p class="muted">ภาพรวมความปลอดภัยและข้อมูลเชิงลึกของโรงเรียน</p><label>อีเมลโรงเรียน</label><input placeholder="admin@school.ac.th"><label>รหัสผ่าน</label><input type="password" placeholder="••••••••"><button class="btn primary full" onclick="go('dashboard')">เข้าสู่ระบบ</button><div class="demo"><b>Admin Demo</b> · บัญชีทดลอง</div><button class="btn secondary full" onclick="go('dashboard')">เข้าสู่ Demo ผู้บริหาร</button></div></div>`}function table(){return `<table class="table"><thead><tr><th>Case</th><th>นักเรียน</th><th>ประเภท</th><th>Risk</th><th>Location</th><th>เวลา</th><th>สถานะ</th></tr></thead><tbody>${C.map(c=>`<tr><td><b>#${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td><span class="badge ${rc(c[3])}">${c[3]}</span></td><td>${c[4]}</td><td>${c[5]}</td><td>${c[6]}</td></tr>`).join('')}</tbody></table>`}function dashboard(){layout(`<div class="stats"><div class="card stat"><small>Total Reports</small><strong>39</strong></div><div class="card stat red"><small>High Risk Cases</small><strong>7</strong></div><div class="card stat orange"><small>Average Response Time</small><strong>8.4 นาที</strong></div><div class="card stat green"><small>Resolved Cases</small><strong>24</strong></div></div><div class="grid2"><div class="card section ai"><h3>✦ AI School Insights</h3><p>Building B has become the highest-risk area this month.</p><p>Bullying reports increased during lunch break.</p><p>3 students require follow-up.</p><p>Average response time improved this month.</p></div><div class="card section pattern"><h3>⚠️ Pattern Detected</h3><h1>+42%</h1><p>เหตุการณ์ลักษณะคล้ายกันเพิ่มขึ้นในอาคาร B ช่วงพักกลางวัน</p><div class="grid3"><div class="metric"><small>Peak time</small><strong>12:00–13:00</strong></div><div class="metric"><small>Most common</small><strong>Bullying</strong></div><div class="metric"><small>Location</small><strong>Building B</strong></div></div></div></div><div class="card section"><h3>Recommended Actions</h3><div class="grid2"><div class="insight">1. เพิ่มเจ้าหน้าที่ดูแลช่วงพักกลางวัน</div><div class="insight">2. ทบทวน CCTV coverage</div><div class="insight">3. ปรับปรุงแสงสว่างรอบอาคาร B</div><div class="insight">4. นัดติดตามนักเรียนที่ต้องการการช่วยเหลือ</div></div><div class="actions"><button class="btn primary" onclick="toast('สร้าง Action Plan แล้ว')">Create Action Plan</button></div></div><div class="card section"><h3>Escalation Overview</h3><div class="grid3"><div class="metric"><small>Critical cases</small><strong class="red">2</strong></div><div class="metric"><small>High-risk cases</small><strong class="orange">5</strong></div><div class="metric"><small>Pending intervention</small><strong>8</strong></div></div></div><div class="card section tablewrap"><div class="section-head"><h3>ข้อมูลเคสจาก Teacher Side</h3><button class="btn secondary" onclick="go('esc')">Review Cases</button></div>${table()}</div><p class="muted" style="font-size:12px">AI เป็น Risk Detection, Pattern Detection, Early Intervention และ Decision Support เท่านั้น มนุษย์เป็นผู้ตัดสินใจและดำเนินการช่วยเหลือ</p>`,'School Safety Overview')}function insights(){layout(`<div class="grid2"><div class="card section ai"><h3>อาคาร B</h3><p>พื้นที่ที่มีความเสี่ยงสูงที่สุดในเดือนนี้</p><b>12 incidents</b></div><div class="card section ai"><h3>Lunch Break</h3><p>Bullying reports เพิ่มขึ้นช่วง 12:00–13:00</p><b>+42%</b></div><div class="card section ai"><h3>Follow-up</h3><p>มีนักเรียน <b>3 คน</b> ที่ต้องติดตามผล</p></div><div class="card section ai"><h3>Response Time</h3><p>ดีขึ้นจาก 10.2 → <b>8.4 นาที</b></p></div></div>`,'AI School Insights')}function pattern(){layout(`<div class="card section pattern"><h1>⚠️ Pattern Detected</h1><p>Similar incidents have increased in Building B during lunch break.</p><div class="grid3"><div class="metric"><small>Incident increase</small><strong>+42%</strong></div><div class="metric"><small>Peak time</small><strong>12:00–13:00</strong></div><div class="metric"><small>Most common</small><strong>Bullying</strong></div></div></div><div class="card section"><h3>AI Recommended Actions</h3><ol><li>Increase staff supervision during lunch break</li><li>Review CCTV coverage</li><li>Improve lighting around Building B</li><li>Schedule student support follow-up</li></ol><button class="btn primary" onclick="toast('สร้าง Action Plan สำหรับ Building B แล้ว')">Create Action Plan</button></div>`,'AI Pattern Detection')}function map(){layout(`<div class="card section"><div class="map"><button class="building safe a" onclick="detail('อาคาร A','Safe',4,'ความขัดแย้ง')">🟢 อาคาร A</button><button class="building high b" onclick="detail('อาคาร B','High Risk',12,'การกลั่นแกล้ง')">🟠 อาคาร B</button><button class="building critical gym" onclick="detail('โรงยิม','Critical',7,'ความรุนแรงทางร่างกาย')">🔴 โรงยิม</button><button class="building watch caf" onclick="detail('โรงอาหาร','Watch',5,'ความขัดแย้ง')">🟡 โรงอาหาร</button><button class="building safe lib" onclick="detail('ห้องสมุด','Safe',3,'การคุกคาม')">🟢 ห้องสมุด</button><button class="building safe rest" onclick="detail('ห้องน้ำ','Safe',2,'อื่น ๆ')">🟢 ห้องน้ำ</button><button class="building court" onclick="detail('ลานกิจกรรม','Safe',2,'อื่น ๆ')">🟢 ลานกิจกรรม</button></div><div id="d" class="detail"></div></div>`,'School Safety Map')}function detail(a,r,n,t){document.getElementById('d').innerHTML=`<div class="card section"><h3>${a}</h3><div class="grid3"><div class="metric"><small>Incidents this month</small><strong>${n}</strong></div><div class="metric"><small>Compared with previous</small><strong>${a==='อาคาร B'?'+42%':'+8%'}</strong></div><div class="metric"><small>Most common</small><strong>${t}</strong></div></div><div class="ai" style="padding:15px;border-radius:14px;margin-top:14px"><b>AI Insight</b><br>${a==='อาคาร B'?'Repeated incidents detected in the same location during lunch break.':'ยังไม่พบ Pattern ที่มีความเสี่ยงผิดปกติ'}<br><br><b>Recommendation:</b> ${a==='อาคาร B'?'เพิ่มเจ้าหน้าที่ดูแลช่วง 12:00–13:00':'ติดตามแนวโน้มต่อเนื่อง'}</div></div>`}function analytics(){layout(`<div class="grid2"><div class="card section"><h3>Incidents over time</h3><div class="bars">${[7,9,6,11,8,13,12].map(n=>`<div class="bar" style="height:${n*10}px"></div>`).join('')}</div></div><div class="card section"><h3>Incident categories</h3><div style="font-size:40px;text-align:center;padding:40px">🔵 45%<br>🟠 25% · 🟢 18% · 🔴 12%</div></div><div class="card section"><h3>Risk by location</h3><div class="grid3"><div class="metric"><small>Building B</small><strong class="orange">12</strong></div><div class="metric"><small>Gym</small><strong class="red">7</strong></div><div class="metric"><small>Cafeteria</small><strong>5</strong></div></div></div><div class="card section"><h3>Average response time</h3><h1>8.4 นาที</h1><p class="green">↓ 17.6% จากเดือนก่อน</p></div></div>`,'Analytics')}function esc(){layout(`<div class="card section tablewrap"><h3>Escalation Overview</h3>${table()}<div class="actions"><button class="btn primary" onclick="toast('มอบหมายเจ้าหน้าที่แล้ว')">Assign Staff</button><button class="btn danger" onclick="toast('ส่งต่อแล้ว')">Escalate</button><button class="btn secondary" onclick="toast('เปิด Review Case')">Review Case</button></div></div>`,'Escalation Overview')}function privacy(){layout(`<div class="privacy"><div class="card section metric"><b>Role-based access</b><p class="muted">สิทธิ์ตามบทบาท Student / Teacher / Admin</p><span class="badge bg">เปิดใช้งาน</span></div><div class="card section metric"><b>Confidential reporting</b><p class="muted">รองรับรายงานแบบเป็นความลับ</p><span class="badge bg">เปิดใช้งาน</span></div><div class="card section metric"><b>Location permission</b><p class="muted">แชร์ตำแหน่งเฉพาะเมื่อได้รับอนุญาต</p><span class="badge bg">ควบคุมโดยผู้ใช้</span></div><div class="card section metric"><b>Data access history</b><p class="muted">ตรวจสอบประวัติการเข้าถึงข้อมูล</p><button class="btn secondary" onclick="toast('เปิด Data Access History')">ดูประวัติ</button></div></div><div class="card section"><h3>Privacy Principle</h3><p><b>Student information is only accessible to authorized personnel.</b></p><p class="muted">AI ใช้ข้อมูลเพื่อ Risk Detection, Pattern Detection, Early Intervention และ Decision Support เท่านั้น</p></div>`,'Privacy & Data Security')}function profile(){layout(`<div class="card section"><h2>ผู้บริหาร</h2><div class="grid3"><div class="metric"><small>บทบาท</small><strong>School Admin</strong></div><div class="metric"><small>โรงเรียน</small><strong>โรงเรียนสาธิต</strong></div><div class="metric"><small>อีเมล</small><strong>admin@school.ac.th</strong></div></div></div>`,'Admin Profile')}function render(){if(S.p==='login')login();else if(S.p==='dashboard')dashboard();else if(S.p==='insights')insights();else if(S.p==='pattern')pattern();else if(S.p==='map')map();else if(S.p==='analytics')analytics();else if(S.p==='esc')esc();else if(S.p==='privacy')privacy();else profile()}render();
</script></body></html>
